[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# По одной строке на тест — видно имена и файл, без одной строки «N passed»
addopts = -v
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: быстрые модульные тесты без HTTP
    integration: интеграционные тесты FastAPI TestClient
    slow: медленные тесты (по желанию отключать через -m "not slow")
