name: CI-CD

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

jobs:
  # GitHub Actions JS actions Node20 deprecation mitigation
  # (forces actions/checkout, setup-node, setup-python to run on Node 24 runtime)
  # See GitHub changelog notice in CI logs.
  backend-quality:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff

      - name: Lint backend
        run: ruff check backend

      - name: Run backend unit tests
        run: pytest backend/tests/unit -q

  frontend-quality:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false --watchAll=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t fullstack-backend:ci backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t fullstack-frontend:ci frontend

      - name: Validate compose config
        run: docker compose config

  deploy-self-hosted:
    runs-on: self-hosted
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup conflicting containers (if any)
        shell: powershell
        run: |
          docker rm -f fs-minio 2>$null
          docker rm -f fs-postgres 2>$null
          docker rm -f fs-backend 2>$null
          docker rm -f fs-frontend 2>$null
          docker rm -f fs-proxy 2>$null

      - name: Deploy locally via Docker Compose
        run: docker compose up -d --build

  # NOTE: Remote SSH deploy is intentionally removed for the "deploy to my PC"
  # setup (self-hosted runner). If you later decide to deploy to a VPS, we can
  # re-add this job with proper secrets.
